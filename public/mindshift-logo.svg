<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The Halo mark</title>
  <desc id="desc">Five colored segments form an open halo around a human creative spark.</desc>
  <defs>
    <linearGradient id="core" x1="170" y1="150" x2="350" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a2520"/>
      <stop offset="1" stop-color="#0a0f0d"/>
    </linearGradient>
    <linearGradient id="spark" x1="196" y1="196" x2="316" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.52" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="143" fill="url(#core)" stroke="#243330" stroke-width="2"/>
  <circle cx="256" cy="256" r="174" fill="none" stroke="#243330" stroke-width="10" opacity="0.7"/>
  <g fill="none" stroke-width="30" stroke-linecap="round" stroke-dasharray="176 917" transform="rotate(-19 256 256)">
    <circle cx="256" cy="256" r="174" stroke="#2dd4bf" transform="rotate(0 256 256)"/>
    <circle cx="256" cy="256" r="174" stroke="#34d6a6" transform="rotate(72 256 256)"/>
    <circle cx="256" cy="256" r="174" stroke="#3ed98d" transform="rotate(144 256 256)"/>
    <circle cx="256" cy="256" r="174" stroke="#4ade80" transform="rotate(216 256 256)"/>
    <circle cx="256" cy="256" r="174" stroke="#22c55e" transform="rotate(288 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="94" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.18"/>
  <path d="M256 177c8 43 28 63 71 71-43 8-63 28-71 71-8-43-28-63-71-71 43-8 63-28 71-71Z" fill="url(#spark)" filter="url(#soft-glow)"/>
  <circle cx="256" cy="248" r="10" fill="#f7faf8"/>
</svg>
